# VTG Pool 3D — nginx site: WebGL game at https://pool.example.com/ and the room server at wss://pool.example.com/ws
# 1. Replace pool.example.com and the certificate paths (e.g. from certbot).
# 2. Copy the WebGL build (Builds/WebGL/*) to /var/www/vtgpool.
# 3. sudo cp nginx-vtgpool.conf /etc/nginx/sites-available/vtgpool && sudo ln -s ../sites-available/vtgpool /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name pool.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pool.example.com;

    ssl_certificate     /etc/letsencrypt/live/pool.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pool.example.com/privkey.pem;

    root /var/www/vtgpool;
    index index.html;

    # Room server (Node, Server/server.js on 127.0.0.1:8765).
    location /ws {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Unity WebGL files. The build uses gzip with a decompression fallback (.unityweb), so it works without
    # special Content-Encoding headers.
    location /Build/ {
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
